<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
  </defs>
  <rect width="900" height="240" rx="16" fill="url(#bg)"/>
  <circle cx="780" cy="60" r="90" fill="#ffffff" opacity="0.05">
    <animate attributeName="r" values="80;100;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="200" r="70" fill="#ffffff" opacity="0.05">
    <animate attributeName="r" values="60;80;60" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="450" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">
    Francis Adrian Idul
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze"/>
  </text>
  <text x="450" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#9be7ff">
      Just Gramming, not yet a Pro!
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="1.5s" fill="freeze"/>
  </text>
  <text x="450" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cfd8dc">
    IoT  •  Mobile  •  Web  •  Game 
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="1.5s" fill="freeze"/>
  </text>
</svg>
